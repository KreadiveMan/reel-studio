<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة Reel Studio</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <button id="menu" class="icon" aria-label="المشاريع">☰</button>
  <a class="brand" href="#"><span class="mark">▶</span><span><b>Reel Studio</b><small>لوحة المونتاج</small></span></a>
  <span id="conn" class="conn">بيتصل…</span>
</header>
<div class="layout">
  <aside id="side">
    <button id="new" class="primary wide">＋ مشروع جديد</button>
    <button id="files" class="side-link">ملفاتك المرفوعة</button>
    <h2>المشاريع</h2>
    <nav id="projects"><p class="dim">لسه مفيش مشاريع.</p></nav>
    <div class="side-foot">
      <button id="settings" class="side-link">إعداداتي <small>الاسم والألوان والستايل</small></button>
      <div id="disk"></div>
      <button id="logout" class="side-link" hidden>خروج</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<template id="tpl-home">
  <div class="hello">
    <h1>أهلًا 👋</h1>
    <p>ارفع الفيديو، وقول عايز إيه، وClaude يعمل الباقي. وانت متابع كل خطوة من هنا.</p>
  </div>
  <section class="panel step">
    <div class="step-head"><span class="num">١</span><div><h2>ارفع الفيديو</h2><p class="dim">الملف بيتحفظ في فولدر Raw على السيرفر، ومفيش ملف قديم بيتمسح.</p></div></div>
    <div class="drop" tabindex="0"><span class="drop-icon">⬆</span><strong>اسحب الفيديوهات هنا</strong><span class="dim">أو اضغط واختار من جهازك</span>
      <input type="file" multiple hidden accept="video/*,audio/*,image/*"></div>
    <form class="link-form"><span class="or">أو من لينك</span><input name="url" type="url" dir="ltr" placeholder="لينك ملف أو فولدر: drive.google.com/…  أو  mega.nz/…" autocomplete="off"><button class="ghost" type="submit">جيب الملف</button></form>
    <p class="link-hint dim">لينك ملف أو فولدر كامل من Google Drive أو MEGA، متشارك «لأي حد معاه اللينك». في الفولدر بينزّل كل الفيديوهات والصور والصوت اللي جواه. السيرفر بينزّل على طول، فده أسرع من الرفع للملفات الكبيرة.</p>
    <div class="queue"></div>
  </section>
  <section class="panel step">
    <div class="step-head"><span class="num">٢</span><div><h2>ابدأ مشروع</h2><p class="dim">اختار نوع الشغل، وClaude هيسألك لو محتاج حاجة.</p></div></div>
    <form class="new-form">
      <div class="kinds">
        <label class="kind"><input type="radio" name="kind" value="recording" checked><span class="k-icon">🎥</span><b>فيديو متسجّل</b><small>ريل من كلامك قدام الكاميرا</small></label>
        <label class="kind"><input type="radio" name="kind" value="graphics"><span class="k-icon">✨</span><b>موشن من فكرة</b><small>من غير تسجيل، من فكرة مكتوبة</small></label>
        <label class="kind"><input type="radio" name="kind" value="podcast"><span class="k-icon">🎙️</span><b>بودكاست</b><small>حلقة طويلة تتقطع كليبات</small></label>
        <label class="kind"><input type="radio" name="kind" value="montage"><span class="k-icon">🎵</span><b>مونتاج على الموسيقى</b><small>فيديوهات وصور على الإيقاع بساوند ديزاين</small></label>
      </div>
      <div class="mont">
        <label class="field"><span>الموسيقى</span><select name="music"></select></label>
        <div class="field"><span>الفيديوهات والصور <span class="opt">صوت الفيديوهات هيتشال</span></span><div class="mpicks picks"></div><span class="mpick-note pick-note"></span></div>
        <div class="row2">
          <label class="field"><span>المدة</span><select name="duration"><option value="15">15 ثانية</option><option value="30" selected>30 ثانية</option><option value="45">45 ثانية</option><option value="60">دقيقة</option><option value="full">طول الموسيقى</option></select></label>
          <label class="field"><span>السرعة</span><select name="pace"><option value="calm">هادية — قطعات أطول</option><option value="medium" selected>متوسطة</option><option value="fast">سريعة — قطعة كل ضربة</option></select></label>
        </div>
      </div>
      <div class="field rec"><span class="rec-label">الفيديو</span><div class="picks"></div><span class="pick-note"></span></div>
      <label class="field pod"><span>عدد الكليبات <span class="opt">اختياري</span></span><input name="clips" type="number" min="1" max="10" placeholder="Claude يقترح من 3 لـ 5"></label>
      <div class="row2">
        <label class="field style-field"><span>الستايل</span><select name="style"><option value="">تلقائي — Claude يختار</option></select></label>
        <label class="field"><span>اسم المشروع <span class="opt">اختياري</span></span><input name="title" maxlength="80" placeholder="مثلًا: ريل العرض الجديد"></label>
      </div>
      <label class="field"><span class="notes-label">ملاحظاتك</span><textarea name="notes" rows="3" maxlength="4000" placeholder="أي حاجة عايزها: الطول، الجمهور، حاجة تتشال…"></textarea></label>
      <p class="form-error"></p>
      <button class="primary big" type="submit">ابدأ المونتاج</button>
    </form>
  </section>
  <section class="panel">
    <h2>ملفاتك المرفوعة</h2>
    <div class="rawlist"><p class="dim">بحمّل…</p></div>
  </section>
</template>

<template id="tpl-project">
  <section class="head panel">
    <div class="title-row"><h2 class="ptitle"></h2><span class="badge"></span></div>
    <div class="meta dim"></div>
    <div class="queued-box" hidden><span>⏳ المشروع ده في الطابور، وهيبدأ لوحده أول ما Claude يخلص اللي قبله.</span><button class="ghost start-now">ابدأ دلوقتي</button></div>
    <ol class="stages"></ol>
    <div class="bar"><i></i></div>
    <div class="activity"></div>
    <div class="render" hidden><div class="render-line"></div><div class="bar"><i></i></div></div>
    <div class="links"></div>
    <div class="head-foot"><span class="psize"></span><button class="textbtn del">مسح المشروع</button></div>
  </section>
  <dialog class="del-dialog">
    <form method="dialog">
      <h3>مسح المشروع</h3>
      <p class="dim">المحادثة وتتبّع المشروع هيتمسحوا من اللوحة. الفيديو الخام في Raw مش هيتمسح.</p>
      <label><input type="checkbox" name="studio"> امسح ملفات الشغل كمان (Projects) — البريفيو والمسودات</label>
      <label><input type="checkbox" name="outputs"> امسح الفيديو النهائي كمان (Outputs)</label>
      <div class="btns"><button value="ok" class="danger">امسح</button><button value="cancel" class="ghost">إلغاء</button></div>
    </form>
  </dialog>
  <nav class="tabs" role="tablist">
    <button data-tab="chat" class="on">الشات</button>
    <button data-tab="plan">الخطة</button>
    <button data-tab="preview">البريفيو</button>
    <button data-tab="editor">المحرر</button>
    <button data-tab="output">المخرج النهائي</button>
  </nav>
  <section class="tab chat panel" data-pane="chat">
    <div class="log"></div>
    <div class="approvals"></div>
    <form class="composer">
      <textarea rows="2" placeholder="اكتب لـ Claude… (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
      <div class="actions"><button class="primary" type="submit">ابعت</button><button class="danger stop" type="button" hidden>وقّف</button></div>
    </form>
  </section>
  <section class="tab panel" data-pane="plan" hidden></section>
  <section class="tab panel" data-pane="preview" hidden></section>
  <section class="tab panel" data-pane="editor" hidden></section>
  <section class="tab panel" data-pane="output" hidden></section>
</template>
<script src="/app.js"></script>
</body>
</html>
