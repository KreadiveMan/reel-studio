<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول — لوحة Reel Studio</title>
<link rel="stylesheet" href="/fonts.css">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f8f8f7; color:#1d1f23; font-family:'IBM Plex Sans Arabic', system-ui, 'Segoe UI', Tahoma, sans-serif; }
  form { background:#fff; border:1px solid #ebebe8; border-radius:18px; padding:36px 32px; width:min(92vw, 380px); box-shadow:0 1px 2px rgba(20,24,31,.04), 0 8px 30px rgba(20,24,31,.05); }
  .mark { width:40px; height:40px; border-radius:12px; background:#4a63e7; color:#fff; display:grid; place-items:center; font-size:14px; margin-bottom:16px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 4px; } .sub { color:#6c717a; margin:0 0 22px; font-size:14px; }
  input { width:100%; box-sizing:border-box; font:inherit; background:#fff; border:1px solid #dededa; border-radius:12px; padding:12px 14px; color:#1d1f23; outline:none; }
  input:focus { border-color:#4a63e7; box-shadow:0 0 0 4px #eef1fd; }
  button { margin-top:14px; width:100%; font:inherit; background:#4a63e7; color:#fff; border:0; border-radius:12px; padding:12px; cursor:pointer; }
  button:hover { background:#2f45c4; }
  p.err { color:#c43a3a; min-height:1.2em; margin:12px 0 0; font-size:14px; }
</style>
</head>
<body>
<form>
  <div class="mark">▶</div><h1>أهلًا بيك تاني</h1><p class="sub">اكتب الباسورد عشان تفتح لوحة Reel Studio.</p>
  <input type="password" name="password" placeholder="الباسورد" autocomplete="current-password" autofocus required>
  <button type="submit">ادخل</button>
  <p class="err"></p>
</form>
<script>
document.querySelector('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.querySelector('p.err'); msg.textContent = '';
  const res = await fetch('/api/login', {method: 'POST', headers: {'content-type': 'application/json', 'x-dashboard': '1'}, body: JSON.stringify({password: e.target.password.value})});
  const data = await res.json().catch(() => ({}));
  if (res.ok && data.ok) location.reload(); else msg.textContent = data.error || 'حصلت مشكلة.';
});
</script>
</body>
</html>
